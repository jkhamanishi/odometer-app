<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odometer Tracker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <h2>Submit Odometer Reading</h2>
      
      <form id="odometerForm">
        <div class="field">
          <label>Odometer Photo:</label>
          
          <div class="button-group">
            <button type="button" id="btnGallery">📁 Choose from Gallery</button>
            <button type="button" id="btnCamera">📷 Take Photo</button>
          </div>
          
          <p id="fileNameDisplay" class="file-name">No photo selected</p>

          <!-- Photo Preview Element -->
          <div id="previewContainer" style="display: none; margin-top: 14px;">
            <div id="cropperWrapper" class="cropper-wrapper"></div>

            <button type="button" id="btnCropScan" class="btn-crop-scan">
              🔍 Crop & Scan Selection
            </button>

            <!-- Live Crop Preview Container -->
            <div id="croppedPreviewContainer" style="display: none; margin-top: 12px; text-align: center;">
              <p style="font-size: 0.8rem; color: #666; margin-bottom: 4px; font-weight: bold;">Cropped Selection:</p>
              <div id="croppedPreviewWrapper" style="display: inline-block; border: 2px solid #28a745; border-radius: 6px; padding: 4px; background: #fff; max-width: 100%;"></div>
            </div>

            <!-- Processed OCR Debug Canvas Container -->
            <div id="debugOcrContainer" style="display: none; margin-top: 14px; text-align: center;">
              <p style="font-size: 0.85rem; color: #333; margin-bottom: 8px; font-weight: bold;">
                Pipeline Intermediate Steps:
              </p>
              <div id="debugOcrWrapper" style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #eef2f5; padding: 10px; border-radius: 8px; border: 1px solid #ccd5ae;"></div>
            </div>

            <p id="ocrStatus" class="ocr-status"></p>
          </div>

          <input type="file" id="inputGallery" accept="image/*" style="display: none;" />
          <input type="file" id="inputCamera" accept="image/*" capture="environment" style="display: none;" />
        </div>

        <br/>

        <div class="field">
          <label for="odometer">Odometer Value:</label>
          <input type="number" id="odometer" required placeholder="e.g. 84520" />
        </div>

        <button type="submit" id="submitBtn">Submit Reading</button>
      </form>

      <p id="status"></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
